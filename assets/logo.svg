    <circle cx="128" cy="128" r="116" stroke-width="2.5"/>
    <circle cx="128" cy="128" r="108" stroke-width="1"/>

    <!-- wings: fine engraved feathers -->
    <g stroke-width="2.2">
      <path d="M122 94 Q 100 86 78 68"/>
      <path d="M122 100 Q 97 96 74 82"/>
      <path d="M122 106 Q 96 106 70 99"/>
      <path d="M122 112 Q 99 116 77 117"/>
      <path d="M134 94 Q 156 86 178 68"/>
      <path d="M134 100 Q 159 96 182 82"/>
      <path d="M134 106 Q 160 106 186 99"/>
      <path d="M134 112 Q 157 116 179 117"/>
    </g>

    <!-- staff -->
    <path d="M128 90 L 128 206" stroke-width="3"/>
    <path d="M118 206 L 138 206" stroke-width="2.4"/>

    <!-- entwined serpents -->
    <g stroke-width="2.2">
      <path d="M128 202 C 112 192 112 172 128 162 C 144 152 144 132 128 122 C 117 115 117 106 125 100"/>
      <path d="M128 202 C 144 192 144 172 128 162 C 112 152 112 132 128 122 C 139 115 139 106 131 100"/>
    </g>

    <!-- serpent heads -->
    <g stroke-width="2">
      <circle cx="121" cy="97" r="3.4" fill="#23211b"/>
      <circle cx="135" cy="97" r="3.4" fill="#23211b"/>
      <path d="M119 95 L 114 92"/>
      <path d="M137 95 L 142 92"/>
