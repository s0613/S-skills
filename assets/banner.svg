  <rect x="0" y="0" width="1040" height="300" rx="28" fill="url(#panel)"/>
  <rect x="0" y="0" width="1040" height="300" rx="28" fill="url(#halo)"/>

  <!-- mark: winged caduceus (source art 0..256 scaled 0.82) -->
