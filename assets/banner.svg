<svg width="1040" height="300" viewBox="0 0 1040 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="S-skills — 역할 기반 개발 오케스트레이터">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1040" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.5" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#2e1065"/>
