  <text x="372" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="92" font-weight="800" fill="url(#word)" letter-spacing="-2">S-skills</text>
  <text x="376" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#a78bfa" letter-spacing="0.5">역할 기반 개발 오케스트레이터</text>
