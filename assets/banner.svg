<svg width="1120" height="240" viewBox="0 0 1120 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="S-skills — 혼자 일하는 개발자의 팀">

  <!-- Background -->
  <rect width="1120" height="240" fill="#0a1725"/>

  <!-- Subtle radial vignette (top-left warmth, like page bg gradient) -->
  <radialGradient id="vignette" cx="0" cy="0" r="1" gradientUnits="objectBoundingBox">
    <stop offset="0" stop-color="#ffac02" stop-opacity="0.06"/>
    <stop offset="1" stop-color="#0a1725" stop-opacity="0"/>
  </radialGradient>
  <rect width="1120" height="240" fill="url(#vignette)"/>

  <!-- ── LEFT ZONE: Wordmark (0–430) ── -->

  <!-- S-SKILLS main title -->
  <text x="48" y="148"
    font-family="Impact, 'Arial Narrow', 'Franklin Gothic Medium', Arial, sans-serif"
    font-size="88"
    fill="#ffac02"
    letter-spacing="1">S-SKILLS</text>

  <!-- Hairline under title -->
  <line x1="48" y1="160" x2="372" y2="160" stroke="#ffac02" stroke-opacity="0.28" stroke-width="1"/>

  <!-- Tagline -->
  <text x="48" y="180"
    font-family="'Courier New', Courier, monospace"
    font-size="12"
    fill="#ffac02"
    fill-opacity="0.65"
    letter-spacing="0.5">혼자서도 기업처럼.</text>

  <!-- Version -->
  <text x="48" y="210"
    font-family="'Courier New', Courier, monospace"
    font-size="10"
    fill="#ffac02"
    fill-opacity="0.32"
    letter-spacing="2">V 3 . 1 . 2</text>

  <!-- Vertical divider -->
  <line x1="430" y1="20" x2="430" y2="220" stroke="#ffac02" stroke-opacity="0.18" stroke-width="1"/>

  <!-- ── RIGHT ZONE: Terminal Panel (430–1120) ── -->
  <rect x="430" width="690" height="240" fill="#000000" fill-opacity="0.32"/>

  <!-- ── INSTALL row ── -->
  <text x="454" y="43"
    font-family="'Courier New', Courier, monospace"
    font-size="9"
    fill="#ffac02"
    fill-opacity="0.4"
    letter-spacing="2">INSTALL</text>

  <!-- Input background -->
  <rect x="454" y="52" width="320" height="34" fill="#000000" fill-opacity="0.65"/>
  <!-- Full border -->
  <rect x="454" y="52" width="386" height="34" fill="none" stroke="#ffac02" stroke-opacity="0.35" stroke-width="1"/>
  <!-- Input / button divider -->
  <line x1="774" y1="52" x2="774" y2="86" stroke="#ffac02" stroke-opacity="0.35" stroke-width="1"/>
  <!-- Button fill -->
  <rect x="774" y="52" width="66" height="34" fill="#ffac02"/>

  <!-- Install command text -->
  <text x="466" y="74"
    font-family="'Courier New', Courier, monospace"
    font-size="12"
    fill="#ffac02">claude plugin install s0613/S-skills</text>

  <!-- Button label -->
  <text x="807" y="74"
    font-family="Impact, Arial, sans-serif"
    font-size="11"
    fill="#0a1725"
    text-anchor="middle">COPY</text>

  <!-- ── DEMO row ── -->
  <line x1="454" y1="102" x2="1090" y2="102" stroke="#ffac02" stroke-opacity="0.13" stroke-width="1"/>

  <text x="454" y="116"
    font-family="'Courier New', Courier, monospace"
    font-size="9"
    fill="#ffac02"
    fill-opacity="0.4"
    letter-spacing="2">DEMO</text>

  <!-- Prompt line -->
  <text x="454" y="134"
    font-family="'Courier New', Courier, monospace"
    font-size="11.5"
    fill="#ffac02"
    fill-opacity="0.38">❯ </text>
  <text x="468" y="134"
    font-family="'Courier New', Courier, monospace"
    font-size="11.5"
    fill="#ffac02">/sj-company 로그인 기능 만들어줘</text>

  <!-- PM / Tech Lead response -->
  <text x="454" y="152"
    font-family="'Courier New', Courier, monospace"
    font-size="11"
    fill="#ffac02"
    fill-opacity="0.62">[ PM → Tech Lead ]  database · backend · security · frontend</text>

  <!-- Completion -->
  <text x="454" y="170"
    font-family="'Courier New', Courier, monospace"
    font-size="11"
    fill="#ffac02"
    fill-opacity="0.88">✓ 완료 — 4개 에이전트 · 모든 테스트 통과</text>

  <!-- ── Bottom meta ── -->
  <line x1="454" y1="190" x2="1090" y2="190" stroke="#ffac02" stroke-opacity="0.11" stroke-width="1"/>

  <text x="454" y="210"
    font-family="'Courier New', Courier, monospace"
    font-size="10"
    fill="#ffac02"
    fill-opacity="0.28"
    letter-spacing="1">MIT · 2026 · SONG SEUNGJU</text>

  <!-- Decorative dots (top-right atmosphere) -->
  <circle cx="1058" cy="28" r="1.5" fill="#ffac02" fill-opacity="0.32"/>
  <circle cx="1076" cy="40" r="1"   fill="#ffac02" fill-opacity="0.22"/>
  <circle cx="1048" cy="46" r="1"   fill="#ffac02" fill-opacity="0.18"/>
  <circle cx="1068" cy="18" r="1"   fill="#ffac02" fill-opacity="0.18"/>
  <circle cx="1088" cy="32" r="1.5" fill="#ffac02" fill-opacity="0.14"/>

  <!-- Outer border -->
  <rect x="1" y="1" width="1118" height="238" fill="none" stroke="#ffac02" stroke-opacity="0.18" stroke-width="1"/>

</svg>
